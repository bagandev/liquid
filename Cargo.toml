[package]
name = "rust_liquid"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
liquid = "0.26.11"
liquid-core = "0.26.11"
napi = { version = "3", features = ["napi8", "serde-json", "async", "tokio_rt"] }
napi-derive = "3"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde_yml = "0.0.13"

[build-dependencies]
napi-build = "2"

# Lib
[lib]
name = "rust_liquid"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]